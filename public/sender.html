<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0f14">
    <title>Desktop Stream Sender</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell sender-shell">
      <section class="panel">
        <header class="topbar">
          <div>
            <strong>Screen Stream</strong>
            <span id="senderStatus">idle</span>
          </div>
          <button id="stopShare" class="danger" type="button" disabled>Stop</button>
        </header>

        <div class="video-frame">
          <video id="localPreview" autoplay muted playsinline></video>
        </div>

        <section class="grid">
          <button id="startShare" type="button">Share Screen</button>
        </section>
      </section>
    </main>
    <script src="/sender.js"></script>
  </body>
</html>
