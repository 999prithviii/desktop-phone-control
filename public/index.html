<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#0b0f14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Desktop Control">
    <title>Desktop Control</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section id="pairPanel" class="panel">
        <h1>Desktop Control</h1>
        <p>Enter the pairing code shown on your laptop.</p>
        <form id="pairForm" class="pair-form">
          <input id="pairCode" autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="000000">
          <button type="submit">Pair</button>
        </form>
        <p id="pairError" class="error"></p>
      </section>

      <section id="controlPanel" class="hidden">
        <header class="topbar">
          <div>
            <strong>Desktop Control</strong>
            <span id="status">paired</span>
          </div>
          <button id="panic" class="danger" type="button">Release</button>
        </header>

        <section class="theme-bar" aria-label="Display settings">
          <button id="themeToggle" type="button">Dark</button>
          <select id="accentSelect" aria-label="Accent color">
            <option value="mint">Mint</option>
            <option value="coral">Coral</option>
            <option value="sun">Sun</option>
            <option value="future">Future</option>
            <option value="cyan">Cyan</option>
            <option value="pink">Pink</option>
          </select>
        </section>

        <section class="stream-panel" aria-label="Screen stream">
          <div class="video-frame">
            <video id="remoteStream" autoplay playsinline muted></video>
          </div>
          <section class="grid two">
            <button id="connectStream" type="button">Connect Stream</button>
            <button id="stopStream" class="danger" type="button" disabled>Stop Stream</button>
          </section>
          <span id="streamStatus" class="micro-status">idle</span>
        </section>

        <label class="slider-row" for="sensitivity">
          <span>Sensitivity</span>
          <input id="sensitivity" type="range" min="0.8" max="5" step="0.1" value="2.6">
          <strong id="sensitivityValue">2.6x</strong>
        </label>

        <section id="pad" class="touchpad" aria-label="Touchpad"></section>

        <section class="mouse-buttons" aria-label="Mouse buttons">
          <button data-mouse-button="left" type="button" aria-label="Left mouse button"></button>
          <button data-mouse-button="right" type="button" aria-label="Right mouse button"></button>
        </section>

        <section id="shortcutDeck" class="shortcut-deck" aria-label="Shortcut menus"></section>

        <section id="shortcutEditor" class="shortcut-editor hidden" aria-label="Edit shortcuts">
          <header class="section-head">
            <strong>Edit Shortcuts</strong>
            <span id="shortcutEditorStatus">locked</span>
          </header>
          <form id="shortcutForm" class="shortcut-form">
            <input id="shortcutLabel" autocomplete="off" maxlength="40" placeholder="Button label">
            <input id="shortcutKey" autocomplete="off" maxlength="40" placeholder="ctrl+s">
            <button type="submit">Add</button>
          </form>
          <section id="shortcutList" class="shortcut-list" aria-label="Saved shortcuts"></section>
          <button id="saveShortcuts" type="button">Save Shortcuts</button>
        </section>

        <form id="searchForm" class="text-row hidden">
          <input id="searchText" autocomplete="off" placeholder="Search or open URL">
          <button type="submit">Go</button>
        </form>

        <form id="typeForm" class="text-row hidden">
          <input id="typeText" autocomplete="off" placeholder="Type text into focused app">
          <button type="submit">Type</button>
        </form>

        <footer class="app-credit">
          <span>Built by Prithvi</span>
          <span>Designer &amp; Builder</span>
          <span>v0.1.29</span>
        </footer>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
