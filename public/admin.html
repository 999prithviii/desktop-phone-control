<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0f14">
    <title>Desktop Control Shortcuts</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell admin-shell">
      <section class="panel">
        <header class="topbar">
          <div>
            <strong>Phone Shortcuts</strong>
            <span id="adminStatus">loading</span>
          </div>
          <button id="saveShortcuts" type="button">Save</button>
        </header>

        <form id="shortcutForm" class="shortcut-form">
          <input id="shortcutLabel" autocomplete="off" maxlength="40" placeholder="Button label">
          <input id="shortcutKey" autocomplete="off" maxlength="40" placeholder="ctrl+s">
          <button type="submit">Add</button>
        </form>

        <section id="shortcutList" class="shortcut-list" aria-label="Saved shortcuts"></section>
      </section>
    </main>
    <script src="/admin.js"></script>
  </body>
</html>
